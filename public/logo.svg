<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer Rounded Crest Container -->
  <rect width="48" height="48" rx="14" fill="#0B0F17" />
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="url(#crest_border)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Academic Shield Backing Glow -->
  <path d="M24 8L37 13.5V23C37 31.5 31.5 38.5 24 41C16.5 38.5 11 31.5 11 23V13.5L24 8Z" fill="url(#shield_glow)" fill-opacity="0.12" />

  <!-- Modern Academic Cap / Apex -->
  <path d="M24 11L36 17L24 23L12 17L24 11Z" fill="url(#gold_grad)" />
  <!-- Under-cap shadow contour -->
  <path d="M16 20.5V26.5C16 26.5 18.5 30 24 30C29.5 30 32 26.5 32 26.5V20.5L24 24.5L16 20.5Z" fill="#151C28" stroke="#D4A373" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Golden Graduation Tassel -->
  <path d="M34 18V24.5C34 25.3 33.3 26 32.5 26" stroke="#E6BE8A" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="32.5" cy="26.5" r="1" fill="#E6BE8A" />

  <!-- Open Book Chevron / 'A' Wings -->
  <path d="M17 28C20 27 23 27.5 24 29C25 27.5 28 27 31 28V34C28 33 25 33.5 24 35C23 33.5 20 33 17 34V28Z" fill="#FFFFFF" />

  <!-- Center AI Core Intelligence Node -->
  <circle cx="24" cy="30.5" r="1.5" fill="#D4A373" />
  <path d="M24 28V33M21.5 30.5H26.5" stroke="#784D28" stroke-width="0.5" stroke-linecap="round" />

  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="crest_border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6BE8A" />
      <stop offset="0.5" stop-color="#784D28" />
      <stop offset="1" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="shield_glow" x1="24" y1="8" x2="24" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4A373" />
      <stop offset="1" stop-color="#0B0F17" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gold_grad" x1="12" y1="11" x2="36" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E5D0" />
      <stop offset="0.3" stop-color="#D4A373" />
      <stop offset="0.8" stop-color="#B8824C" />
      <stop offset="1" stop-color="#784D28" />
    </linearGradient>
  </defs>
</svg>
